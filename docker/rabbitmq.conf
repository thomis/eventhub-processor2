# Modern (sysctl-style) configuration, see https://www.rabbitmq.com/docs/configure
# Replaces the deprecated Erlang-term rabbitmq.config.

# allow guest/guest from outside the container (dev/test only)
loopback_users = none

listeners.tcp.default = 5672

default_vhost = event_hub

# vhost, user, exchanges, queues and bindings used by the specs
definitions.import_backend = local_filesystem
definitions.local.path = /etc/rabbitmq/definitions.json

management.tcp.port = 15672
